apiVersion: apps/v1
kind: Deployment
metadata:
  name: novalux-model-server
  namespace: novalux-ai
  labels:
    app: novalux-model-server
    component: ai-processing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: novalux-model-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: novalux-model-server
        component: ai-processing
    spec:
      serviceAccountName: novalux-ai-model-server
      containers:
      - name: model-server
        image: novalux/model-server:v1.0.0
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8001
          name: grpc
        - containerPort: 9090
          name: metrics
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-headless.novalux-data.svc.cluster.local:9092"
        - name: ELASTICSEARCH_HOSTS
          value: "elasticsearch-master.novalux-data.svc.cluster.local:9200"
        - name: MODEL_BASE_PATH
          value: "/models"
        - name: MAX_CONCURRENT_REQUESTS
          value: "100"
        - name: ENABLE_BATCHING
          value: "true"
        - name: ENABLE_CACHING
          value: "true"
        - name: CACHE_SIZE_MB
          value: "4096"
        - name: TELEMETRY_ENABLED
          value: "true"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
        volumeMounts:
        - name: config-volume
          mountPath: /etc/novalux
        - name: models-volume
          mountPath: /models
      volumes:
      - name: config-volume
        configMap:
          name: novalux-ai-model-server-config
      - name: models-volume
        persistentVolumeClaim:
          claimName: novalux-model-storage
---
apiVersion: v1
kind: Service
metadata:
  name: novalux-model-server
  namespace: novalux-ai
  labels:
    app: novalux-model-server
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: http
    name: http
  - port: 8001
    targetPort: grpc
    name: grpc
  - port: 9090
    targetPort: metrics
    name: metrics
  selector:
    app: novalux-model-server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: novalux-model-storage
  namespace: novalux-ai
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: novalux-model-server-hpa
  namespace: novalux-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: novalux-model-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
