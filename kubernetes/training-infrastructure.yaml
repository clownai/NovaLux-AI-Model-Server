---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novalux-experiment-tracker
  namespace: novalux-ai
  labels:
    app: novalux-experiment-tracker
    component: ai-processing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novalux-experiment-tracker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: novalux-experiment-tracker
        component: ai-processing
    spec:
      serviceAccountName: novalux-ai-model-server
      containers:
      - name: experiment-tracker
        image: novalux/experiment-tracker:v1.0.0
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: DATABASE_URL
          value: "postgresql://mlflow:password@experiment-tracker-db:5432/mlflow"
        - name: ARTIFACT_ROOT
          value: "/mnt/artifacts"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
        volumeMounts:
        - name: artifact-volume
          mountPath: /mnt/artifacts
      volumes:
      - name: artifact-volume
        persistentVolumeClaim:
          claimName: novalux-experiment-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: novalux-experiment-tracker
  namespace: novalux-ai
  labels:
    app: novalux-experiment-tracker
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: http
    name: http
  - port: 9090
    targetPort: metrics
    name: metrics
  selector:
    app: novalux-experiment-tracker
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: novalux-experiment-artifacts
  namespace: novalux-ai
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: novalux-training-scheduler
  namespace: novalux-ai
spec:
  schedule: "0 * * * *"  # Run every hour
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: novalux-ai-model-server
          containers:
          - name: scheduler
            image: novalux/training-scheduler:v1.0.0
            imagePullPolicy: IfNotPresent
            env:
            - name: ORCHESTRATOR_URL
              value: "http://novalux-training-orchestrator:8080"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-headless.novalux-data.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "model-training-requests"
          restartPolicy: OnFailure
