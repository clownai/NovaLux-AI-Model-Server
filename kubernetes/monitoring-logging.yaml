apiVersion: apps/v1
kind: Deployment
metadata:
  name: novalux-logging
  namespace: novalux-ai
  labels:
    app: novalux-logging
    component: ai-processing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novalux-logging
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: novalux-logging
        component: ai-processing
    spec:
      serviceAccountName: novalux-ai-model-server
      containers:
      - name: fluentd
        image: fluent/fluentd-kubernetes-daemonset:v1.14-debian-elasticsearch7-1
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "0.5"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        env:
        - name: FLUENT_ELASTICSEARCH_HOST
          value: "elasticsearch-master.novalux-data.svc.cluster.local"
        - name: FLUENT_ELASTICSEARCH_PORT
          value: "9200"
        - name: FLUENT_ELASTICSEARCH_SCHEME
          value: "http"
        - name: FLUENT_ELASTICSEARCH_USER
          value: "elastic"
        - name: FLUENT_ELASTICSEARCH_PASSWORD
          value: "changeme"  # In production, use Kubernetes secrets
        - name: FLUENT_ELASTICSEARCH_INDEX_NAME
          value: "novalux-ai-logs"
        volumeMounts:
        - name: fluentd-config
          mountPath: /fluentd/etc/fluent.conf
          subPath: fluent.conf
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
      volumes:
      - name: fluentd-config
        configMap:
          name: novalux-fluentd-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
---
apiVersion: v1
kind: Service
metadata:
  name: novalux-logging
  namespace: novalux-ai
  labels:
    app: novalux-logging
spec:
  type: ClusterIP
  ports:
  - port: 24224
    targetPort: 24224
    name: forward
  selector:
    app: novalux-logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: novalux-fluentd-config
  namespace: novalux-ai
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/containers/novalux-*.log
      pos_file /var/log/novalux-containers.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type json
        time_format %Y-%m-%dT%H:%M:%S.%NZ
      </parse>
    </source>
    
    <filter kubernetes.**>
      @type kubernetes_metadata
      kubernetes_url https://kubernetes.default.svc
      bearer_token_file /var/run/secrets/kubernetes.io/serviceaccount/token
      ca_file /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      skip_labels false
      skip_container_metadata false
      skip_namespace_metadata false
      skip_master_url false
    </filter>
    
    <filter kubernetes.**>
      @type record_transformer
      <record>
        hostname ${hostname}
        tag ${tag}
      </record>
    </filter>
    
    <match kubernetes.var.log.containers.novalux-model-server**>
      @type elasticsearch
      host "#{ENV['FLUENT_ELASTICSEARCH_HOST']}"
      port "#{ENV['FLUENT_ELASTICSEARCH_PORT']}"
      scheme "#{ENV['FLUENT_ELASTICSEARCH_SCHEME'] || 'http'}"
      user "#{ENV['FLUENT_ELASTICSEARCH_USER']}"
      password "#{ENV['FLUENT_ELASTICSEARCH_PASSWORD']}"
      index_name novalux-model-server-logs
      type_name fluentd
      logstash_format true
      logstash_prefix novalux-model-server
      <buffer>
        flush_thread_count 8
        flush_interval 5s
        chunk_limit_size 2M
        queue_limit_length 32
        retry_max_interval 30
        retry_forever true
      </buffer>
    </match>
    
    <match kubernetes.var.log.containers.novalux-inference-api**>
      @type elasticsearch
      host "#{ENV['FLUENT_ELASTICSEARCH_HOST']}"
      port "#{ENV['FLUENT_ELASTICSEARCH_PORT']}"
      scheme "#{ENV['FLUENT_ELASTICSEARCH_SCHEME'] || 'http'}"
      user "#{ENV['FLUENT_ELASTICSEARCH_USER']}"
      password "#{ENV['FLUENT_ELASTICSEARCH_PASSWORD']}"
      index_name novalux-inference-api-logs
      type_name fluentd
      logstash_format true
      logstash_prefix novalux-inference-api
      <buffer>
        flush_thread_count 8
        flush_interval 5s
        chunk_limit_size 2M
        queue_limit_length 32
        retry_max_interval 30
        retry_forever true
      </buffer>
    </match>
    
